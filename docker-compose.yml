services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refresh
    ports:
      - "5433:5432"
    volumes:
      - ./refresh_service/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: pg_isready -U postgres -d refresh
      interval: 2s
      retries: 30

  api:
    build: .
    command: uvicorn refresh_service.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/refresh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m refresh_service.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/refresh
      PYTHONUNBUFFERED: "1"
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
